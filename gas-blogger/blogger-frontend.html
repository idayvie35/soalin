  var LEVELS = ['SD', 'SMP', 'SMA', 'SMK', 'MA', 'MTs', 'MI', 'Perguruan Tinggi', 'Umum'];

    SD: ['Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'],
    MI: ['Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'],

  };
  var LANGUAGES = ['Indonesia', 'Arab', 'Inggris', 'Indonesia-Arab', 'Indonesia-Inggris'];
  var BLOOM_CODES = ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'];

  var NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'create', label: 'Buat Soal' },
    { id: 'projects', label: 'Proyek Saya' },
    { id: 'editor', label: 'Editor & Preview' },
    { id: 'kisi_kisi', label: 'Kisi-Kisi (Kurmer)' },
    { id: 'rpp_kurmer', label: 'RPP (Kurmer)' },
    { id: 'bank', label: 'Bank Soal' },
    { id: 'history', label: 'Riwayat' },
    { id: 'templates', label: 'Template Soal' },
    { id: 'export', label: 'Ekspor Dokumen' },
    { id: 'profile', label: 'Profil' },
    { id: 'settings', label: 'Pengaturan' },
    { id: 'admin', label: 'Admin Panel', adminOnly: true },
  ];

  var storedGasUrl = localStorage.getItem('soalin_gas_url') || '';

    storedGasUrl = '';
    localStorage.setItem('soalin_gas_url', DEFAULT_GAS_URL);
  }

  var state = {
    gasUrl: storedGasUrl || DEFAULT_GAS_URL,
    token: localStorage.getItem('soalin_session_token') || '',
    user: JSON.parse(localStorage.getItem('soalin_user') || 'null'),
    publicConfig: null,
    page: 'dashboard',
    dashboard: null,
    projects: [],
    activeProject: null,
    editorMode: 'teacher', // student | teacher | edit
    autosaveLabel: '',
    bankItems: [],
    selectedBankIds: {},
    historyItems: [],
    templates: [],
    adminData: null,
    adminModels: [],
    activeJob: null,
    pollTimer: null,
    form: {
      title: '',
      subtitles: [],
      subtitleDraft: '',
      description: '',
      referenceText: '',
      level: 'SMA',
      subject: 'Bahasa Arab',
      grade: 'Kelas 11',
      language: 'Indonesia-Arab',
      difficulty: 'Campuran',
      cognitiveLevels: ['C2', 'C3', 'C4'],
      hotsPercentage: 30,
      depth: 'Menengah',
      questionLength: 'Standar',
      optionCount: 5,
      shuffleQuestions: false,
      shuffleOptions: true,
      arabicFocus: 'Nahwu',
      harakatMode: 'Penuh',
      rewriteWordMode: 'progressive',
      rewriteWordCount: 3,
      counts: { pilihan_ganda: 5, esai: 2, benar_salah: 2, hots: 1 },
    },
    rpp: null,
    rppMode: 'preview',
  };

  function cleanAsterisks(input) {
    if (input === null || input === undefined) return '';
    var text = String(input);
    text = text.replace(/(\d\s*)\*(\s*\d)/g, '$1__MATH_MUL__$2');
    text = text.replace(/^\s*\*\s+/gm, '• ');
    text = text.replace(/\*/g, '');
    text = text.replace(/^\s*#{1,6}\s+/gm, '');
    text = text.replace(/`/g, '');
    text = text.replace(/__MATH_MUL__/g, '×');
    return text.replace(/[ \t]+\n/g, '\n').trim();
  }

  function esc(str) {
    return cleanAsterisks(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isArabic(str) {
    return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(String(str || ''));
  }

  function hasLatin(str) {
    return /[A-Za-z\u00C0-\u024F]/.test(String(str || ''));
  }

  function isPureArabic(str) {
    var s = cleanAsterisks(str);
    if (!s) return false;
    return isArabic(s) && !hasLatin(s);
  }

  function getDir(str) {
    return isPureArabic(str) ? 'rtl' : 'ltr';
  }

  function toast(title, msg, isErr) {
    var wrap = document.getElementById('sl-toasts');
    var el = document.createElement('div');
    el.className = 'sl-toast';
    el.style.borderColor = isErr ? '#FCA5A5' : '#A7F3D0';
    el.innerHTML =
      '<strong style="color:' + (isErr ? '#B91C1C' : '#065F46') + ';">' + esc(title) + '</strong>' +
      (msg ? '<div class="sl-meta" style="margin-top:3px;">' + esc(msg) + '</div>' : '');
    wrap.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4500);
  }

  // Communication Adapter GAS: text/plain menghindari CORS OPTIONS preflight pada Google Apps Script WebApp
  async function callGas(action, payload, timeoutMs) {
    if (!state.gasUrl || state.gasUrl.indexOf('PASTE_YOUR_DEPLOYMENT_ID') !== -1) {
      throw new Error('URL Google Apps Script belum diatur. Buka menu Pengaturan untuk mengisi URL Web App GAS.');
    }
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 45000);
    try {
      var res = await fetch(state.gasUrl, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: action,
          token: state.token,
          payload: payload || {},
          requestId: 'req-' + Date.now(),
        }),
        signal: controller.signal,
      });
      var text = await res.text();
      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error('Respons GAS bukan JSON valid. Pastikan Web App diakses sebagai Anyone.');
      }
      if (!data.ok) {
        var code = data.error && data.error.code;
        if (code === 'UNAUTHORIZED') {
          state.token = '';
          state.user = null;
          localStorage.removeItem('soalin_session_token');
          localStorage.removeItem('soalin_user');
          render();
        }
        throw new Error((data.error && data.error.message) || 'Permintaan gagal.');
      }
      return data.data;
    } finally {
      clearTimeout(timer);
    }
  }

  function renderNav() {
    var dNav = document.getElementById('sl-desktop-nav');
    var mNav = document.getElementById('sl-mobile-nav-list');
    var items = NAV_ITEMS.filter(function (n) {
      return !n.adminOnly || (state.user && state.user.role === 'Administrator');
    });

    var html = items.map(function (item) {
      var cls = 'sl-nav-btn' + (state.page === item.id ? ' active' : '');
      return '<button type="button" class="' + cls + '" onclick="SoalinApp.go(\'' + item.id + '\')">' + esc(item.label) + '</button>';
    }).join('');
    dNav.innerHTML = html;
    mNav.innerHTML = html;

    var footer = document.getElementById('sl-sidebar-footer');
    if (state.user) {
      footer.innerHTML =
        '<div style="font-weight:600;color:var(--sl-text);">' + esc(state.user.name) + '</div>' +
        '<div class="sl-meta">' + esc(state.user.role) + '</div>' +
        '<button type="button" class="sl-btn sl-btn-sec" style="width:100%;margin-top:8px;min-height:36px;" onclick="SoalinApp.logout()">Keluar</button>';
      document.getElementById('sl-mobile-user').textContent = state.user.name;
    } else {
      footer.innerHTML = '<span class="sl-meta">Belum login</span>';
      document.getElementById('sl-mobile-user').textContent = '';
    }

    document.querySelectorAll('.sl-mobile-bottom button[data-nav]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === state.page);
    });
  }

  function renderLoginOrConfig() {
    var main = document.getElementById('sl-main-view');

  function getFaseKurmer(level, grade) {
    var lvl = String(level || '').toUpperCase();
    var gr = String(grade || '').toUpperCase();
    if (lvl.indexOf('SD') !== -1 || lvl.indexOf('MI') !== -1) {
      if (/\b(1|2|I|II)\b/.test(gr)) return 'Fase A (Kelas 1–2)';
      if (/\b(3|4|III|IV)\b/.test(gr)) return 'Fase B (Kelas 3–4)';
      return 'Fase C (Kelas 5–6)';
    }
    if (lvl.indexOf('SMP') !== -1 || lvl.indexOf('MTS') !== -1) return 'Fase D (Kelas 7–9)';
    if (lvl.indexOf('SMA') !== -1 || lvl.indexOf('SMK') !== -1 || lvl.indexOf('MA') !== -1) {
      if (/\b(10|X)\b/.test(gr)) return 'Fase E (Kelas 10)';
      return 'Fase F (Kelas 11–12)';
    }
    return 'Fase Umum';
  }

  function buildKisiKisiRow(q, p) {
    var tObj = QUESTION_TYPES.find(function (t) { return t.code === q.type; });
    var bentuk = (tObj && tObj.label) || q.type;
    var materi = q.topic_tag || (p && (p.title || p.subject)) || '-';
    var cog = q.cognitive_level || 'C2';
    var tier = q.thinking_tier || (cog === 'C1' || cog === 'C2' ? 'LOTS' : cog === 'C3' ? 'MOTS' : 'HOTS');
    var cp = q.capaian_pembelajaran ||
      ('Peserta didik menguasai capaian pembelajaran ' + ((p && p.subject) || '') + ' pada ' + getFaseKurmer(p && p.level, p && p.grade) + ' terkait materi ' + ((p && p.title) || '') + '.');
    var tp = q.tujuan_pembelajaran ||
      ('Peserta didik mampu memahami dan menerapkan konsep ' + materi + ' pada mata pelajaran ' + ((p && p.subject) || '') + '.');
    var ind = q.indikator_soal ||
      ('Disajikan stimulus/pernyataan tentang ' + materi + ', peserta didik dapat menyelesaikan soal ' + bentuk + ' dengan tepat.');
    return {
      number: q.number,
      cp: cp,
      tp: tp,
      materi: materi,
      indikator: ind,
      cognitiveLevel: cog,
      thinkingTier: tier,
      bentukSoal: bentuk,
      weight: q.weight || 2,
    };
  }

  function getSynchronizedMatching(pairs) {
    if (!Array.isArray(pairs) || pairs.length === 0) {
      return { rows: [], rightOptions: [], answerKey: '' };
    }
    var n = pairs.length;
    var order = n === 4 ? [1, 3, 0, 2] : pairs.map(function (_, i) { return n > 1 ? (i + 1) % n : 0; });
    var rightOptions = order.map(function (origIdx, dispIdx) {
      return {
        letter: String.fromCharCode(65 + dispIdx),
        text: (pairs[origIdx] && pairs[origIdx].right) || '',
        originalIndex: origIdx,
      };
    });
    var rows = pairs.map(function (p, idx) {
      var matched = rightOptions.find(function (o) { return o.originalIndex === idx; });
      return {
        number: idx + 1,
        left: p.left || '',
        correctLetter: (matched && matched.letter) || String.fromCharCode(65 + idx),
        correctRight: p.right || '',
      };
    });
    var answerKey = rows.map(function (r) {
      return r.number + ' → ' + r.correctLetter + ' (' + r.correctRight + ')';
    }).join('; ');
    return { rows: rows, rightOptions: rightOptions, answerKey: answerKey };
  }

                    '</div>' +
                    '<div style="border:1px dashed #94A3B8;border-radius:10px;padding:10px 14px;background:#F8FAFC;margin-bottom:10px;">' +
                      '<div style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:6px;">1. Tebalkan Garis Kata / Kalimat Arab (التَّتَبُّعُ):</div>' +

                      '<div style="min-height:130px;border:1px dashed #E2E8F0;border-radius:8px;background:#FFF;display:flex;align-items:center;justify-content:center;padding:8px 14px;text-align:center;">' +

                    '</div>' +
                  '</div>';
                })()
              : '') +
            (state.editorMode === 'teacher'

  async function loadInitialUserData() {
    try {
      var results = await Promise.all([
        callGas('dashboard'),
        callGas('projects_list', { page: 1, pageSize: 30 }),
        callGas('templates_list'),
      ]);
      state.dashboard = results[0];
      state.projects = results[1].items || [];
      state.templates = results[2] || [];
    } catch (err) {
      toast('Gagal Memuat Data', err.message, true);
    }
  }

  function startJobPolling(jobId) {
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = setInterval(async function () {
      try {
        var job = await callGas('job_status', { job_id: jobId, autoAdvance: true }, 90000);
        state.activeJob = job;
        render();
        if (job.status === 'Completed') {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
          toast('Selesai!', job.completed_count + ' soal berhasil disusun dan divalidasi.');
          await window.SoalinApp.openProject(job.project_id);
        } else if (job.status === 'Failed' || job.status === 'Cancelled') {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
          toast('Proses Berhenti', job.error_message || job.progress_message, job.status === 'Failed');
        }
      } catch (err) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        toast('Polling Error', err.message, true);
      }
    }, 1800);
  }

  window.SoalinApp = {
    toggleDrawer: function (open) {
      document.getElementById('sl-drawer-backdrop').classList.toggle('open', open);
    },
    go: async function (page) {
      state.page = page;
      this.toggleDrawer(false);
      render();
      if (!state.token) return;
      try {
        if (page === 'dashboard') state.dashboard = await callGas('dashboard');
        if (page === 'projects') state.projects = (await callGas('projects_list', { page: 1, pageSize: 50 })).items || [];
        if (page === 'bank') state.bankItems = (await callGas('bank_search', { page: 1, pageSize: 50 })).items || [];
        if (page === 'history') state.historyItems = (await callGas('history_list', { page: 1, pageSize: 40 })).items || [];
        if (page === 'templates') state.templates = await callGas('templates_list');
        if (page === 'admin') state.adminData = await callGas('admin_overview');
        render();
      } catch (err) {
        toast('Error', err.message, true);
      }
    },
    saveGasUrlFromInput: async function (inputId) {
      var val = document.getElementById(inputId).value.trim();
      state.gasUrl = val;
      localStorage.setItem('soalin_gas_url', val);
      try {
        var h = await callGas('health');
        state.publicConfig = h.publicConfig;
        toast('Terhubung ke GAS', 'Status konfigurasi: ' + (h.configReady ? 'Siap' : 'Perlu dilengkapi di Script Properties'));
        render();
      } catch (err) {
        toast('Koneksi Gagal', err.message, true);
      }
    },
    logout: async function () {
      try { await callGas('auth_logout'); } catch (e) {}
      state.token = '';
      state.user = null;
      localStorage.removeItem('soalin_session_token');
      localStorage.removeItem('soalin_user');
      render();
    },
    setForm: function (k, v) {
      state.form[k] = v;
      if (k === 'level') {
        var opts = GRADE_BY_LEVEL[v] || GRADE_BY_LEVEL.Umum;
        state.form.grade = opts[0] || '';
        if (v === 'SD' || v === 'MI') state.form.optionCount = 3;
        else if (v === 'SMP' || v === 'MTs') state.form.optionCount = 4;
        else state.form.optionCount = 5;
        render();
      } else if (k === 'title' || k === 'grade') {
        render();
      }
    },
    setCount: function (type, val) { state.form.counts[type] = Math.max(0, Number(val) || 0); render(); },
    addSubtitle: function () {
      var el = document.getElementById('f-sub-draft');
      if (!el || !el.value.trim()) return;
      state.form.subtitles.push(el.value.trim());
      render();
    },
    removeSubtitle: function (idx) { state.form.subtitles.splice(idx, 1); render(); },
    toggleBloom: function (c) {
      var idx = state.form.cognitiveLevels.indexOf(c);
      if (idx >= 0 && state.form.cognitiveLevels.length > 1) state.form.cognitiveLevels.splice(idx, 1);
      else if (idx === -1) state.form.cognitiveLevels.push(c);
      render();
    },
    startGeneration: async function () {
      try {
        var payload = Object.assign({}, state.form, {
          subtitles: state.form.subtitles.length > 0 ? state.form.subtitles : [state.form.title],
        });
        var job = await callGas('generate_start', payload);
        state.activeJob = job;
        state.activeJob.progress_percent = 10;
        state.activeJob.progress_message = 'Memulai pemrosesan batch...';
        render();
        startJobPolling(job.job_id);
      } catch (err) {
        toast('Gagal Memulai', err.message, true);
      }
    },
    cancelActiveJob: async function () {
      if (!state.activeJob) return;
      await callGas('job_cancel', { job_id: state.activeJob.job_id });
      state.activeJob.status = 'Cancelled';
      if (state.pollTimer) clearInterval(state.pollTimer);
      render();
    },
    openProject: async function (id) {
      state.activeProject = await callGas('project_get', { project_id: id });
      state.page = 'editor';
      render();
    },
    duplicateProject: async function (id) {
      await callGas('project_duplicate', { project_id: id });
      toast('Berhasil', 'Proyek diduplikasi.');
      this.go('projects');
    },
    deleteProject: async function (id) {
      await callGas('project_delete', { project_id: id });
      toast('Dihapus', 'Proyek berhasil dihapus.');
      this.go('projects');
    },
    setEditorMode: function (m) { state.editorMode = m; render(); },
    updateQuestionField: async function (qId, field, value) {
      var q = state.activeProject.questions.find(function (x) { return x.question_id === qId; });
      if (!q) return;
      q[field] = value;
      state.autosaveLabel = 'Menyimpan...';
      render();
      try {
        await callGas('question_update', q);
        state.autosaveLabel = 'Tersimpan otomatis';
        render();
      } catch (err) {
        state.autosaveLabel = 'Gagal simpan';
        toast('Autosave Gagal', err.message, true);
      }
    },
    addManualQuestion: async function () {
      var q = await callGas('question_add', { project_id: state.activeProject.project_id });
      state.activeProject.questions.push(q);
      state.editorMode = 'edit';
      render();
    },
    duplicateQuestion: async function (qId) {
      var copy = await callGas('question_duplicate', { question_id: qId });
      state.activeProject.questions.push(copy);
      render();
    },
    deleteQuestion: async function (qId) {
      await callGas('question_delete', { question_id: qId });
      state.activeProject.questions = state.activeProject.questions.filter(function (x) { return x.question_id !== qId; });
      render();
    },
    regenerateQuestion: async function (qId) {
      toast('Memproses...', 'Sedang meregenerasi soal terpilih via Google AI Studio (Gemini).');
      var newQ = await callGas('question_regenerate', { question_id: qId }, 60000);
      state.activeProject.questions = state.activeProject.questions.map(function (x) {
        return x.question_id === qId ? newQ : x;
      });
      toast('Berhasil', 'Soal berhasil dibuat ulang.');
      render();
    },
    uploadQuestionImage: function (qId, input) {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = async function () {
        try {
          var res = await callGas('question_upload_image', {
            question_id: qId,
            base64DataUrl: reader.result,
            fileName: file.name,
            caption: file.name,
          });
          var q = state.activeProject.questions.find(function (x) { return x.question_id === qId; });
          if (q) { q.image_file_id = res.image_file_id; q.image_url = res.image_url; }
          toast('Gambar Diunggah', 'Tersimpan aman di Google Drive.');
          render();
        } catch (err) {
          toast('Upload Gagal', err.message, true);
        }
      };
      reader.readAsDataURL(file);
    },
    saveToBank: async function (qId) {
      var q = state.activeProject.questions.find(function (x) { return x.question_id === qId; });
      if (!q) return;
      await callGas('bank_save', {
        subject: state.activeProject.subject,
        grade: state.activeProject.grade,
        level: state.activeProject.level,
        language: state.activeProject.language,
        question: q,
      });
      toast('Tersimpan', 'Soal ditambahkan ke Bank Soal Pribadi.');
    },
    toggleBankSelect: function (id, checked) { state.selectedBankIds[id] = checked; render(); },
    toggleBankFav: async function (id) { await callGas('bank_favorite', { bank_id: id }); this.go('bank'); },
    deleteBank: async function (id) { await callGas('bank_delete', { bank_id: id }); this.go('bank'); },
    mergeSelectedBank: async function () {
      var ids = Object.keys(state.selectedBankIds).filter(function (id) { return state.selectedBankIds[id]; });
      var proj = await callGas('bank_merge_project', { bank_ids: ids });
      state.selectedBankIds = {};
      state.activeProject = proj;
      state.page = 'editor';
      toast('Berhasil', ids.length + ' soal digabung menjadi proyek baru.');
      render();
    },
    applyTemplate: function (tplId) {
      var t = state.templates.find(function (x) { return x.template_id === tplId; });
      if (!t) return;
      state.form.title = t.title;
      state.form.subtitles = t.subtitles.slice();
      state.form.subject = t.subject;
      state.form.level = t.level;
      state.form.grade = t.grade;
      state.form.language = t.language;
      state.form.description = t.description;
      if (t.config && t.config.counts) state.form.counts = Object.assign({}, t.config.counts);
      state.page = 'create';
      render();
    },
    saveHeaderForExport: async function () {
      var header = Object.assign({}, state.activeProject.header, {
        institutionName: document.getElementById('ex-inst').value,
        institutionAddress: document.getElementById('ex-addr').value,
        examTitle: document.getElementById('ex-title').value,
        teacherName: document.getElementById('ex-teacher').value,
        timeAllocation: document.getElementById('ex-time').value,
      });
      state.activeProject = await callGas('project_update', {
        project_id: state.activeProject.project_id,
        header: header,
      });
      toast('Disimpan', 'Identitas dokumen diperbarui.');
    },
    runExport: async function () {
      var out = document.getElementById('sl-export-result');
      out.innerHTML = '<div class="sl-meta">Sedang menyusun dokumen resmi di Google Docs &amp; Drive...</div>';
      try {
        var res = await callGas('export_document', {
          project_id: state.activeProject.project_id,
          mode: document.getElementById('ex-mode').value,
          format: document.getElementById('ex-format').value,
          compact: document.getElementById('ex-compact') ? document.getElementById('ex-compact').checked : true,
          includeKisiKisi: document.getElementById('ex-include-kisi') ? document.getElementById('ex-include-kisi').checked : true,
        }, 90000);
        var dlHtml = '<div style="margin-top:10px;padding:12px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;font-size:13px;">' +
          '<strong>Dokumen siap!</strong><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
          '<a href="' + esc(res.download_url) + '" target="_blank" rel="noopener" class="sl-btn" style="text-decoration:none;">Download dari Drive</a>' +
          '<a href="' + esc(res.view_url) + '" target="_blank" rel="noopener" class="sl-btn sl-btn-sec" style="text-decoration:none;">Buka di Drive</a>' +
          '</div></div>';
        out.innerHTML = dlHtml;
        if (res.base64 && res.mime_type) {
          var bin = atob(res.base64);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          var blob = new Blob([arr], { type: res.mime_type });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = res.file_name + '.' + res.format;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
      } catch (err) {
        out.innerHTML = '<div style="color:var(--sl-danger);font-size:13px;">' + esc(err.message) + '</div>';
      }
    },
    saveProfile: async function () {
      state.user = await callGas('profile_update', {
        name: document.getElementById('pr-name').value,
        institution: document.getElementById('pr-inst').value,
        nip: document.getElementById('pr-nip').value,
      });
      localStorage.setItem('soalin_user', JSON.stringify(state.user));
      toast('Disimpan', 'Profil diperbarui.');
      render();
    },
    adminTest: async function (action) {
      try {
        var r = await callGas(action);
        toast('Hasil Diagnostik', JSON.stringify(r).slice(0, 140));
      } catch (err) {
        toast('Diagnostik Gagal', err.message, true);
      }
    },
    adminLoadModels: async function () {
      try {
        var r = await callGas('admin_models_list');
        state.adminModels = r.models || [];
        toast('Model Dimuat', state.adminModels.length + ' model ditemukan dari Google AI Studio.');
        render();
      } catch (err) {
        toast('Gagal Muat Model', err.message, true);
      }
    },
    saveAdminConfig: async function () {
      await callGas('admin_config_update', {
        GEMINI_MODEL: document.getElementById('adm-model').value,
        MAX_QUESTIONS: document.getElementById('adm-maxq').value,
        DAILY_LIMIT: document.getElementById('adm-daily').value,
      });
      toast('Tersimpan', 'Konfigurasi Google AI Studio & kuota diperbarui.');
      this.go('admin');
    },
    toggleUserStatus: async function (userId, nextStatus) {
      await callGas('admin_user_update', { user_id: userId, status: nextStatus });
      toast('Diperbarui', 'Status pengguna diubah menjadi ' + nextStatus);
      this.go('admin');
    },
    syncRppFromForm: function () {
      state.rpp = getDefaultRpp();
      toast('Disinkronkan', 'Materi RPP diperbarui dari proyek/form aktif.');
      render();
    },
    updateRppField: function (field, val) {
      if (!state.rpp) state.rpp = getDefaultRpp();
      state.rpp[field] = cleanAsterisks(val);
      render();
    },
    generateRpp: async function () {
      if (!state.rpp) state.rpp = getDefaultRpp();
      toast('Menyusun RPP...', 'Menghubungi Google AI Studio (Gemini) melalui GAS...');
      try {
        var res = await callGas('generate_rpp', state.rpp, 90000);
        state.rpp = Object.assign(getDefaultRpp(), (res && res.rpp) || res || {});
        toast('RPP Siap!', 'Modul Ajar Kurikulum Merdeka selesai disusun.');
        render();
      } catch (err) {
        toast('Gagal Membuat RPP', err.message, true);
      }
    },
    downloadRppWord: function () {
      if (!state.rpp) state.rpp = getDefaultRpp();
      var html = '<html><head><meta charset="utf-8"><style>@page{size:A4;margin:1.2cm;}body{font-family:Calibri,Amiri,sans-serif;font-size:10pt;}table{width:100%;border-collapse:collapse;}td,th{border:1px solid #94A3B8;padding:4px 6px;}</style></head><body>' + buildRppSheetHtml(state.rpp) + '</body></html>';
      var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'SIT-PLUS-CORDOVA-RPP-Kurmer.doc';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('RPP Word Diunduh', 'File .doc siap dibuka di Microsoft Word.');
    },
  };

  (async function bootstrap() {
    try {
      if (state.gasUrl && state.gasUrl.indexOf('PASTE_YOUR_DEPLOYMENT_ID') === -1) {
        var h = await callGas('health');
        state.publicConfig = h.publicConfig;
      }
      if (state.token && state.user) {
        await loadInitialUserData();
      }
    } catch (e) {}
    render();
  })();
})();
</script>
